<h1>Students List</h1>

<form #studentForm="ngForm" (ngSubmit)="addStudent(studentForm)">
  <input type="text" placeholder="Name" [(ngModel)]="student.name" name="name" required />

  <input type="number" placeholder="Age" [(ngModel)]="student.age" name="age" required />

  <input type="email" placeholder="Email" [(ngModel)]="student.email" name="email" required />

  <input type="text" placeholder="Course" [(ngModel)]="student.course" name="course" required />

  <input type="date" [(ngModel)]="student.admissionDate" name="admissionDate" required />

  <button type="submit" [disabled]="isEditMode">Add Student</button>

  <button type="button" (click)="updateStudent(student, studentForm)" [disabled]="!isEditMode">
    Update Student
  </button>
</form>

<table>
  <thead>
    <tr>
      <th>Id</th>
      <th>Name</th>
      <th>Age</th>
      <th>Email</th>
      <th>Course</th>
      <th>Admission Date</th>
      <th>Actions</th>
    </tr>
  </thead>

  <tbody>
    @for (student of students; track student.id) {
      <tr>
        <td>{{ student.id }}</td>
        <td>{{ student.name }}</td>
        <td>{{ student.age }}</td>
        <td>{{ student.email }}</td>
        <td>{{ student.course }}</td>
        <td>{{ student.admissionDate | date: 'MM-dd-yyyy' }}</td>
        <button (click)="editStudent(student)">Edit</button>
        <button>Delete</button>
      </tr>
    }
  </tbody>
</table>
